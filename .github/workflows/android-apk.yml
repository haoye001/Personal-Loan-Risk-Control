name: Android APK

on:
  push:
    branches: [feature/backend]
    paths:
      - 'python-solution/android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend origin accessible from the Android device
        default: http://127.0.0.1:18080
        type: string
        required: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python-solution/android-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"
      - name: Assemble debug APK
        env:
          LOAN_API_URL: ${{ inputs.api_url || 'http://127.0.0.1:18080' }}
        run: bash gradlew :app:assembleDebug "-PloanApiUrl=$LOAN_API_URL" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loan-android-debug
          path: python-solution/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
